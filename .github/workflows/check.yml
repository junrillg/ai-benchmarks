name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python3 -m unittest discover -s tests
      - run: npm run data:check
      - run: node tests/data-check.ts
      - run: node tests/chart-check.ts
      - run: node tests/navigation-check.ts
      - run: npm run build
